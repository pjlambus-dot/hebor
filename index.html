<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebor - Home</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-black text-white d-flex flex-column min-vh-100">

   <!-- Top Navigation Bar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-secondary position-relative">
    <div class="container-fluid px-4">
        <!-- Left Links -->
        <ul class="navbar-nav me-auto flex-row gap-4">
            <li class="nav-item"><a class="nav-link text-white text-uppercase fs-6" href="store.html">Store</a></li>
            <li class="nav-item"><a class="nav-link text-white text-uppercase fs-6" href="about_us.html">About us</a></li>
            <li class="nav-item"><a class="nav-link text-white text-uppercase fs-6" href="contact_us.html">Contact us</a></li>
        </ul>

        <!-- Center Brand Logo  -->
        <a class="navbar-brand text-center d-flex flex-column align-items-center" href="index.html">
            <img src="Hebor logo (white).png" alt="hebor logo" class="mb-1">
        </a>

        <!-- Right Action Pill Buttons (Search, Shopping Bag, Likes) -->
        <div class="d-flex align-items-center gap-2 ms-auto">
            <!-- Search Pill Button -->
            <a href="store.html" class="btn rounded-pill px-4 py-2 d-inline-flex align-items-center gap-2 fw-bold text-uppercase shadow-sm fs-6" style="background-color: #ffffff; color: #b5b5b5; letter-spacing: 1px; border: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#f39c12" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                <span>SEARCH</span>
            </a>

            <!-- Shopping Bag Pill Button -->
            <a href="shopping_bag.html" class="btn rounded-pill px-4 py-2 d-inline-flex align-items-center gap-2 fw-bold text-uppercase shadow-sm fs-6" style="background-color: #f39c12; color: #ffffff; letter-spacing: 1px; border: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" viewBox="0 0 16 16">
                    <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4zM2 5h12v9H2z"/>
                </svg>
                <span>SHOPPING BAG</span>
            </a>

            <!-- Likes Pill Button -->
            <a href="likes.html" class="btn rounded-pill px-4 py-2 d-inline-flex align-items-center gap-2 fw-bold text-uppercase shadow-sm fs-6" style="background-color: #f39c12; color: #ffffff; letter-spacing: 1px; border: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" viewBox="0 0 16 16">
                    <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01zM8 15C-7.333 4.868 3.27-3.04 7.8 3.243q.09.021.198.043c.106-.022.137-.021.198-.065C12.73-3.04 23.333 4.868 8 15"/>
                </svg>
                <span>LIKES</span>
            </a>
        </div>
    </div>
</nav>

    <!-- Hero Showcase Section with Automatic Background Carousel -->
    <header class="hero-section position-relative text-center d-flex flex-column align-items-center justify-content-center overflow-hidden flex-grow-1" style="min-height: 80vh;">
        
        <!-- Background Automatic Carousel -->
        <div id="heroBgCarousel" class="carousel slide carousel-fade position-absolute top-0 start-0 w-100 h-100 z-0" data-bs-ride="carousel" data-bs-pause="false">
            <div class="carousel-inner w-100 h-100">
                <!-- Slide 1 -->
                <div class="carousel-item active w-100 h-100" data-bs-interval="4000">
                    <img src="Dont be late tee.png" class="d-block w-100 h-100 object-fit-cover" alt="Background Slide 1">
                </div>
                <!-- Slide 2 -->
                <div class="carousel-item w-100 h-100" data-bs-interval="4000">
                    <img src="Everyday Comfort tee.png" class="d-block w-100 h-100 object-fit-cover" alt="Background Slide 2">
                </div>
                <!-- Slide 3 -->
                <div class="carousel-item w-100 h-100" data-bs-interval="4000">
                    <img src="Do good work tee.png" class="d-block w-100 h-100 object-fit-cover" alt="Background Slide 3">
                </div>
            </div>
        </div>

        <!-- Dark overlay to keep foreground text and logo readable -->
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-black opacity-50 z-1"></div>

        <!-- Foreground Content (Title, Center Logo, Shop Now Button) -->
        <div class="container position-relative z-2 py-5">
            <!-- Main Title Overlay -->
            <h1 class="display-3 fw-normal text-white mb-0" style="letter-spacing: 2px;">
                WELCOME TO
            </h1>

            <!-- Center Logo Icon / Graphic -->
            <div class="mb-4">
                <img src="Hebor logo (white).png" alt="Hebor Emblem" style="height: 220px; width: auto; margin-top: -10px;" class="img-fluid">
            </div>

            <!-- Shop Now Pill Button -->
            <div>
                <a href="store.html" class="btn btn-light rounded-pill px-5 py-2 text-dark fw-bold shadow-sm" style="font-size: 14px; letter-spacing: 1px;">
                    SHOP NOW
                </a>
            </div>
        </div>
    </header>

    <!-- Bottom Yellow Section with Privacy policy & Copyright -->
    <section class="py-4 text-center mt-auto" style="background-color: #f39c12;">
        <div class="container">
            <a href="privacy_policy.html" class="btn btn-dark rounded-pill px-4 py-2 text-white fw-semibold mb-2" style="font-size: 12px; letter-spacing: 1px;">
                PRIVACY POLICY
            </a>
            <div class="text-dark small fw-medium mt-1 copyright-text">
                &copy; 2026 <span class="hebor-font">hebor</span>. All rights reserved.
            </div>
        </div>
    </section>

    <!-- Bootstrap JS CDN (Required for Automatic Carousel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
